plugins {
    id 'com.android.application'
}

android {
    namespace 'com.premkurtis.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.premkurtis.app"
        minSdk 24
        targetSdk 36
        versionCode 261024
        versionName "2.0"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            applicationId "com.sts.premkurtis"
            resValue "string", "app_name", "Prem Kurtis"
            buildConfigField "String", "HOME_URL", '"https://www.premkurtis.com/customer"'
        }
        invoice {
            dimension "app"
            applicationId "com.premkurtis.invoice"
            resValue "string", "app_name", "Prem Invoice"
            buildConfigField "String", "HOME_URL", '"https://www.premgarments.net/tally.php"'
        }
    }

    signingConfigs {
        upload {
            storeFile file('upload.jks')
            storePassword 'L6UENDvAmbhlLR4UhUGz'
            keyAlias 'upload'
            keyPassword 'L6UENDvAmbhlLR4UhUGz'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
