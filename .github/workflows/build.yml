name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E "error:|What went wrong|FAILED|Could not|not found|license" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PremKurtis-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Save APK to apk branch
        run: |
          mkdir /tmp/o && cp app/build/outputs/apk/debug/app-debug.apk /tmp/o/PremKurtis.apk
          cd /tmp/o && git init -q -b apk && git config user.name actions && git config user.email actions@github.com
          git add . && git commit -qm "APK build" 
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
